# Build bộ cài Windows (.exe) cho Voice Studio - Mr.Huỳnh.
#
# Cách dùng: tab Actions → "Build Windows (Voice Studio - Mr.Huỳnh)" → Run workflow.
# Xong (khoảng 30–50 phút) tải file .exe ở mục Artifacts của lần chạy.
# Nếu chọn "publish", file .exe còn được đăng lên mục Releases của repo.
name: Build Windows (Voice Studio - Mr.Huỳnh)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Đăng bộ cài lên mục Releases của repo"
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omnivoice-tts:
    uses: ./.github/workflows/build-omnivoice-tts.yml
    with:
      desktop: true
      windows_only: true

  package:
    needs: omnivoice-tts
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VOICESTUDIO_RUST_TARGET: x86_64-pc-windows-msvc
      VOICESTUDIO_OMNIVOICE_TTS_PLATFORM: windows-x86_64
      VOICESTUDIO_UPDATE_CHANNEL: electron-stable-win32-x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/desktop-bridge -> target
          key: electron-x86_64-pc-windows-msvc
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Bundle pinned uv
        run: node electron/scripts/stage-bundled-uv.mjs
      - name: Stage the OmniVoice GGUF runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnivoice-tts-windows-x86_64
          path: electron/build/omnivoice-tts
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check and build
        run: |
          node scripts/validate_store_foundation.mjs
          bun run --cwd electron typecheck
          bun run --cwd electron build
          bun run --cwd electron build:web
          node electron/tests/packaging-contract.mjs
      - name: Package Windows installer
        working-directory: electron
        run: |
          bun x electron-builder --config electron-builder.config.mjs --win --x64 --publish never
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VoiceStudio-MrHuynh-Windows-x64
          path: electron/release/*.exe
          if-no-files-found: error
      - name: Verify the packaged app
        continue-on-error: true
        working-directory: electron
        run: |
          node tests/packaging-contract.mjs --artifact
          node tests/packaged-smoke.mjs --setup

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: VoiceStudio-MrHuynh-Windows-x64
          path: dist
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version=$(ls dist/*.exe | head -1 | sed -E 's/.*VoiceStudio-MrHuynh-(.*)-win-x64\.exe/\1/')
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v${version}-mrhuynh.${GITHUB_RUN_NUMBER}" ;; esac
          gh release create "$tag" dist/*.exe --repo "$REPO" --target "$GITHUB_SHA" \
            --title "Voice Studio - Mr.Huỳnh ${tag}" \
            --notes "Bộ cài Windows (x64) của Voice Studio - Mr.Huỳnh. Hỗ trợ: https://zalo.me/g/lzcnxj126 · https://mrhuynh.net. Dựa trên VoiceStudio (AGPL-3.0); mã nguồn có trong repo này."
