# Chạy đúng script build-windows-mrhuynh.ps1 mà Mr.Huỳnh dùng trên máy mình,
# để kiểm tra script vẫn chạy được. Kết quả là thư mục upload/ (bộ cài + yml + mã nguồn).
name: Build Windows (local script)
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Ghi chú phát hành (các ý cách nhau bằng ;)
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VSMH_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.13'
          enable-cache: false
      - run: rustup target add x86_64-pc-windows-msvc
      - name: Build with the local script
        shell: powershell
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if ($env:NOTES) { .\scripts\build-windows-mrhuynh.ps1 -Notes $env:NOTES }
          else { .\scripts\build-windows-mrhuynh.ps1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upload
          path: upload/
          if-no-files-found: error
