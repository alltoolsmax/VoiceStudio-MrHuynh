# Kiểm tra Voice Studio - Mr.Huỳnh: bộ test Python của backend, test Electron
# và test app cấp key. Chạy khi đẩy code lên bất kỳ nhánh nào.
name: Tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install Python dependencies
        run: bash scripts/uv-sync-retry.sh --all-extras
      - name: Install Electron dependencies
        run: bun install --frozen-lockfile
      - name: Run pytest
        run: uv run --no-sync pytest tests/ -q --tb=short -n 6 -p no:cacheprovider

  electron:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run --cwd electron typecheck
      - run: bun run --cwd electron test

  keygen-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install cryptography pytest
      - run: python -m pytest -q tools/keygen
      - name: License server (PHP) end-to-end
        run: |
          php -v | head -1
          php -m | grep -E 'sodium|pdo_sqlite'
          python -m pytest -q server/tests
